# Local Docker environment: docker compose up -d
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/task_manager
      - JWT_SECRET=development-secret-minimum-16-characters-long
      - JWT_EXPIRES_IN=8h
      - CLIENT_ORIGIN=http://localhost:5173
      - UPLOAD_DIR=uploads
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
