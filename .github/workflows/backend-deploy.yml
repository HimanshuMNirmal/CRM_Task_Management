name: Backend CI/CD - AWS Deployment

on:
  push:
    branches:
      - staging
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  test:
    name: Backend Tests & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm test

      - name: Compile TypeScript
        run: npm run build

  build-and-deploy:
    name: Build Docker & Deploy to AWS (App Runner / ECR)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate backend .env from GitHub Secrets
        env:
          PORT: ${{ secrets.PORT || '5000' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN || '8h' }}
          CLIENT_ORIGIN: ${{ secrets.CLIENT_ORIGIN }}
          UPLOAD_DIR: ${{ secrets.UPLOAD_DIR || 'uploads' }}
        run: |
          echo "Writing backend/.env from GitHub Secrets..."
          cat <<EOF > backend/.env
          PORT=${PORT}
          MONGODB_URI=${MONGODB_URI}
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
          CLIENT_ORIGIN=${CLIENT_ORIGIN}
          UPLOAD_DIR=${UPLOAD_DIR}
          EOF
          echo "backend/.env generated successfully."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build production image for linux/amd64
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:staging \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            backend/

          # Push images to Amazon ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:staging
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "Pushed image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to AWS App Runner (Ultra Low Usage Architecture)
        env:
          APP_RUNNER_SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -n "$APP_RUNNER_SERVICE_ARN" ]; then
            echo "Triggering deployment on AWS App Runner service..."
            aws apprunner start-deployment \
              --service-arn "$APP_RUNNER_SERVICE_ARN" \
              --region "$AWS_REGION"
            echo "AWS App Runner deployment successfully triggered!"
          else
            echo "Notice: APP_RUNNER_SERVICE_ARN secret is not set. Docker image was pushed to ECR, but automatic App Runner deployment trigger was skipped."
          fi
