name: Backend CI/CD - AWS Deployment

on:
  push:
    branches:
      - staging
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  test:
    name: Backend Tests & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm test

      - name: Compile TypeScript
        run: npm run build

  build-and-deploy:
    name: Build Docker & Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate backend .env from GitHub Secrets
        env:
          PORT: ${{ secrets.PORT || '5000' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN || '8h' }}
          CLIENT_ORIGIN: ${{ secrets.CLIENT_ORIGIN }}
          UPLOAD_DIR: ${{ secrets.UPLOAD_DIR || 'uploads' }}
        run: |
          echo "Writing backend/.env from GitHub Secrets..."
          cat <<EOF > backend/.env
          PORT=${PORT}
          MONGODB_URI=${MONGODB_URI}
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
          CLIENT_ORIGIN=${CLIENT_ORIGIN}
          UPLOAD_DIR=${UPLOAD_DIR}
          EOF
          echo "backend/.env generated successfully."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure Port 5000 is open in EC2 Security Group
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -n "$EC2_HOST" ]; then
            echo "Checking Security Group for EC2 Host: $EC2_HOST..."
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters "Name=ip-address,Values=$EC2_HOST" \
              --region "$AWS_REGION" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text 2>/dev/null || echo "")

            if [ "$INSTANCE_ID" != "None" ] && [ -n "$INSTANCE_ID" ]; then
              SG_ID=$(aws ec2 describe-instances \
                --instance-ids "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "Reservations[0].Instances[0].SecurityGroups[0].GroupId" \
                --output text 2>/dev/null || echo "")

              if [ "$SG_ID" != "None" ] && [ -n "$SG_ID" ]; then
                echo "Authorizing port 5000 on Security Group $SG_ID..."
                aws ec2 authorize-security-group-ingress \
                  --group-id "$SG_ID" \
                  --protocol tcp \
                  --port 5000 \
                  --cidr 0.0.0.0/0 \
                  --region "$AWS_REGION" 2>/dev/null || echo "Port 5000 rule already configured in Security Group."
              fi
            fi
          fi

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build production image for linux/amd64
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:staging \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            backend/

          # Push images to Amazon ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:staging
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "Pushed image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Logging into Amazon ECR on EC2..."
            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            export AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}"

            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            echo "Pulling latest CRM backend image..."
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

            echo "Restarting crm-backend container on port 5000..."
            docker stop crm-backend || true
            docker rm crm-backend || true

            # Prune unused images to prevent disk space exhaustion
            docker image prune -f

            # Run new container alongside ResumeForge (:8000)
            docker run -d \
              --name crm-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

            echo "CRM backend successfully deployed on port 5000!"
